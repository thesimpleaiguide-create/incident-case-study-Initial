<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incident Investigation - Remote Consultation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap');

        :root {
            --ttn-navy: #0C2340;
            --ttn-trust-blue: #005EB8;
            --ttn-sky-cyan: #59CBE8;
            --ttn-action-orange: #FE5000;
            --ttn-slate: #333F48;
            --ttn-ice-blue: #DBE2E9;
            --ttn-success: #00BF6F;
            --font-main: 'Inter', sans-serif;
            --font-heading: 'Montserrat', sans-serif;
            --radius-sm: 4px;
            --radius-soft: 8px;
            --radius-card: 16px;
            --shadow-main: 0px 4px 12px rgba(12, 35, 64, 0.08);
            --shadow-hover: 0px 8px 20px rgba(12, 35, 64, 0.12);
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body, html {
            font-family: var(--font-main);
            color: var(--ttn-slate);
            background-color: transparent;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        body::-webkit-scrollbar { display: none; }

        h1, h2, h3, h4, .font-heading {
            font-family: var(--font-heading);
        }

        /* Base Card (Closed State by Default) */
        .clean-card {
            background-color: #FFFFFF;
            border: 1.5px solid var(--ttn-ice-blue);
            border-left: 5px solid var(--ttn-trust-blue);
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-main);
            transition: transform 200ms ease-in-out, box-shadow 200ms ease-in-out, border-color 200ms ease-in-out;
            cursor: pointer;
        }

        .clean-card:hover {
            box-shadow: var(--shadow-hover);
            transform: translateY(-2px);
        }

        .badge-num {
            background-color: #DBE2E9;
            color: var(--ttn-trust-blue);
            transition: background-color 200ms ease, color 200ms ease;
        }

        .chevron-icon {
            color: var(--ttn-trust-blue);
            transform: rotate(0deg); 
            transition: transform 200ms ease, color 200ms ease;
        }

        /* Open Card State */
        .clean-card.open {
            border-left-color: var(--ttn-action-orange);
            border-color: #bfdbfe;
        }

        .clean-card.open .chevron-icon {
            transform: rotate(180deg);
            color: var(--ttn-action-orange);
        }

        .clean-card.open .badge-num {
            background-color: #FFE5D9;
            color: var(--ttn-action-orange);
        }

        /* Slide Switching */
        .slide-pane {
            display: none;
            opacity: 0;
            transition: opacity 200ms ease-in-out;
        }
        .slide-pane.active {
            display: flex;
            opacity: 1;
        }

        /* TTN Buttons */
        .btn-continue {
            background-color: var(--ttn-trust-blue);
            color: #FFFFFF;
            font-family: var(--font-heading);
            font-weight: 700;
